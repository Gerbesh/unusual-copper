name: Build and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon build compileGameTestJava --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: unusual-copper
          path: build/libs/unusualcopper-*.jar
          if-no-files-found: error
