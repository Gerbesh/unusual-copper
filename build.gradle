plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '**/.cache/**'
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    opacTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {
            if (project.hasProperty('smokeClient')) {
                property 'unusualcopper.smokeClient', 'true'
                if (project.hasProperty('smokeClientRu')) property 'unusualcopper.smokeClientRu', 'true'
                args '--quickPlaySingleplayer', 'cue-smoke', '--width', '1280', '--height', '720'
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            if (project.hasProperty('smokeServer')) {
                property 'unusualcopper.smokeServer', 'true'
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
            if (project.hasProperty('opacTests')) {
                workingDirectory project.file('run-opac-server')
                property 'unusualcopper.opacSmoke', 'true'
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
                mods { "${mod_id}" { source sourceSets.gameTest; source sourceSets.opacTest } }
            }
        }
        gameTestServer {
            mods {
                "${mod_id}" { source sourceSets.gameTest }
            }
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
if (project.hasProperty('opacTests')) {
    repositories { flatDir { dirs '.codex-tmp/compat' } }
    dependencies { runtimeOnly fg.deobf('local:open-parties-and-claims-forge-1.20.1:0.30.1') }
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'createSrgToMcp' }
}

tasks.named('test', Test).configure { useJUnitPlatform() }
tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                      mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
                      loader_version_range: loader_version_range, forge_version_range: forge_version_range,
                      minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
